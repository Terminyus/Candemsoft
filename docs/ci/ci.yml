name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: Accessibility (axe, WCAG 2.1 AA)
        run: |
          npx playwright install --with-deps chromium
          npm start -- -p 3000 &
          npx wait-on http://localhost:3000 --timeout 60000
          npm run test:a11y -- http://localhost:3000
